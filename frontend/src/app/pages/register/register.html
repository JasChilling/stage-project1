<div class="register-container">

  <div class="register-box">

    <h1>MiniPlan</h1>

    <h2>Create Account</h2>

    <p>Create an account to start managing your projects.</p>

    <form (ngSubmit)="register()">

      <div class="form-group">

        <label for="username">
          Username
        </label>

        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="Enter your username"
          required
        >

      </div>


      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Enter your email"
          required
        >

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter your password"
          required
        >

      </div>


      <button type="submit">
        Create Account
      </button>

    </form>


    @if (errorMessage) {

      <p class="error">
        {{ errorMessage }}
      </p>

    }


    @if (successMessage) {

      <p class="success">
        {{ successMessage }}
      </p>

    }


    <p class="login-link">

      Already have an account?

      <a routerLink="/login">
        Login
      </a>

    </p>

  </div>

</div>
