<div class="login-container">

  <div class="login-box">

    <h1>TimeSheet</h1>

    <h2>Welcome Back!</h2>

    <p>Login to your account</p>

    <form (ngSubmit)="login()">

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Enter your email"
          required
        >

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter your password"
          required
        >

      </div>


      <button type="submit">
        Login
      </button>

    </form>


    @if (errorMessage) {

      <p class="error">
        {{ errorMessage }}
      </p>

    }
    <p class="register-link">

  Don't have an account?

  <a routerLink="/register">
    Sign Up
  </a>

</p>

  </div>

</div>
